<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="silverText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="greenAcc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bannerBg)" rx="12"/>
  <!-- Decorative border -->
  <rect x="4" y="4" width="792" height="192" fill="none" stroke="url(#silverText)" stroke-width="1.5" rx="10" opacity="0.4"/>
  <!-- Left shield emblem (mini) -->
  <g transform="translate(30, 30) scale(0.55)">
    <path d="M100 10 L180 40 L180 100 C180 145 140 175 100 190 C60 175 20 145 20 100 L20 40 Z" fill="#1e3a8a" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M100 25 L165 48 L165 100 C165 137 132 162 100 175 C68 162 35 137 35 100 L35 48 Z" fill="none" stroke="#cbd5e1" stroke-width="2" opacity="0.6"/>
    <circle cx="100" cy="105" r="28" fill="url(#greenAcc)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="100" y="113" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#cbd5e1">S</text>
  </g>
  <!-- College name -->
  <text x="180" y="65" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="url(#silverText)">Sri Venkateshwaraa College</text>
  <text x="180" y="98" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="url(#silverText)">of Engineering &amp; Technology</text>
  <!-- Location -->
  <text x="180" y="125" font-family="Inter, sans-serif" font-size="14" fill="#94a3b8">Ariyur, Puducherry — 605102</text>
  <!-- Tagline -->
  <text x="180" y="155" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="url(#greenAcc)" letter-spacing="3">ASPIRE TO EXCEL</text>
  <!-- NAAC emblem -->
  <g transform="translate(680, 50)">
    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#silverText)" stroke-width="2"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="url(#silverText)" stroke-width="1" opacity="0.5"/>
    <text x="50" y="42" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="url(#silverText)">NAAC</text>
    <text x="50" y="58" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="url(#silverText)">Accredited</text>
    <path d="M30 70 L70 70" stroke="url(#greenAcc)" stroke-width="2"/>
    <text x="50" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">A Grade</text>
  </g>
</svg>
